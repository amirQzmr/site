            const isDesktopNow = window.innerWidth >= 1024;
            if (window._wasDesktop !== isDesktopNow) {
                window._wasDesktop = isDesktopNow;
                initDeviceLayout();
            }
        });
        window._wasDesktop = window.innerWidth >= 1024;

        function toggleLike(btn) {
            const icon = btn.querySelector('i');
            const countSpan = btn.querySelector('span');
            let count = parseInt(countSpan.innerText);
            
            if(icon.classList.contains('fa-regular')) {
                icon.classList.remove('fa-regular');
                icon.classList.add('fa-solid', 'text-rose-500');
                btn.querySelector('div').classList.add('bg-rose-50');
                countSpan.innerText = count + 1;
                showToast('Вам понравился пост ❤️');
            } else {
                icon.classList.remove('fa-solid', 'text-rose-500');
                icon.classList.add('fa-regular');
                btn.querySelector('div').classList.remove('bg-rose-50');
                countSpan.innerText = count - 1;
            }
        }

                </div>
            `);

        function showModal(title, htmlContent) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            content.innerHTML = `
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-borderLight">
                    <h3 class="font-bold text-sm text-textDark">${title}</h3>
                    <button onclick="closeModal()" class="text-textMuted hover:text-textDark"><i class="fa-solid fa-xmark text-sm"></i></button>
                </div>
                ${htmlContent}
            `;
            
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            overlay.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => overlay.classList.add('hidden'), 200);
        }

        function showToast(message) {
            const existingToast = document.getElementById('toast-notification');
            if(existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-notification';
            toast.className = 'fixed top-16 left-1/2 transform -translate-x-1/2 bg-textDark text-bgMain text-xs px-4 py-2.5 rounded-full shadow-lg z-50 transition-all opacity-0 flex items-center space-x-2 font-medium';
            toast.innerHTML = `<span>✨</span><span>${message}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => toast.classList.remove('opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
